   - Tạo hàng loạt tài khoản con: 1 nút cho Sao Đỏ, 1 nút cho GVCN (mỗi Chi đội 1 tài khoản)
   - Tải danh sách tài khoản (.csv) / in danh sách để phát cho giáo viên
   ======================================================================= */
function genAccPassword(){
  var chars = 'abcdefghjkmnpqrstuvwxyz23456789';   // bỏ ký tự dễ nhầm: i l o 0 1
  for(var tries=0; tries<50; tries++){
    var out = '';
    var buf = new Uint32Array(8);
    if(window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(buf);
    else for(var k=0;k<8;k++) buf[k] = Math.floor(Math.random()*4294967296);
    for(var i=0;i<8;i++) out += chars.charAt(buf[i] % chars.length);
    if(/[a-z]/.test(out) && /[2-9]/.test(out)) return out;
  }
  return 'mk' + Math.floor(100000 + Math.random()*899999);
}
function nextAccountSeq(){
  var max = 0;
  state.accounts.forEach(function(a){
    var m = /^TK(\d+)$/.exec(a.id||''); if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return max;
}
function loaiLabelOf(loai){ return loai==='saodo'? 'Sao Đỏ' : 'GVCN'; }
function bulkCreateAccounts(loai){
  if(!requireAdmin('Tạo hàng loạt tài khoản')) return;
  var label = loaiLabelOf(loai);
  var codes = classCodes();
  var missing = codes.filter(function(c){
    return !state.accounts.some(function(a){ return a.loai===loai && a.assignedClass===c; });
  });
  if(!missing.length){
    alert('Cả '+codes.length+' Chi đội đã có tài khoản '+label+'. Không cần tạo thêm.\n\nBạn có thể bấm “Tải danh sách” để lấy lại danh sách tài khoản.');
    return;
  }
  var existed = codes.length - missing.length;
  if(!confirm('Tạo '+missing.length+' tài khoản '+label+' cho các Chi đội chưa có'+(existed? ' ('+existed+' Chi đội đã có sẵn, được giữ nguyên)' : '')+'?\n\nTên đăng nhập có dạng '+(loai==='saodo'?'saodo':'gvcn')+'.6.1 và mỗi tài khoản được cấp một mật khẩu ngẫu nhiên.')) return;
  var prefix = (loai==='saodo'? 'saodo' : 'gvcn');
  var seq = nextAccountSeq();
  var today = new Date().toLocaleDateString('vi-VN');
  var created = [];
  missing.forEach(function(c){
    var base = prefix+'.'+c.replace('/','.');
    var uname = base, n = 1;
    while(state.accounts.some(function(a){ return a.username===uname; }) || created.some(function(a){ return a.username===uname; })){
      n++; uname = base+'.'+n;
    }
    seq++;
    created.push({ id:'TK'+String(seq).padStart(3,'0'), username:uname, password:genAccPassword(), assignedClass:c, loai:loai, createdAt:today });
  });
  state.accounts = state.accounts.concat(created);
  persist();
  ui.accounts.bulkResult = { loai:loai, label:label, created:created, existed:existed };
  notify('Đã tạo '+created.length+' tài khoản '+label+'.');
}
function accountsOfLoai(loai){
  var order = classCodes();
  return state.accounts.filter(function(a){ return a.loai===loai; }).sort(function(a,b){
    return order.indexOf(a.assignedClass) - order.indexOf(b.assignedClass);
  });
}
function gvcnNameOfClass(code){
  var c = state.classes.filter(function(x){ return x.code===code; })[0];
  return c? (c.gvcn||'') : '';
}
function exportAccountsCsv(loai){
  if(!requireAdmin('Tải danh sách tài khoản')) return;
  var list = accountsOfLoai(loai);
  if(!list.length){ alert('Chưa có tài khoản '+loaiLabelOf(loai)+' nào để tải.'); return; }
  function q(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
  var rows = [['STT','Chi đội','GVCN','Loại tài khoản','Tên đăng nhập','Mật khẩu']];
  list.forEach(function(a,i){ rows.push([i+1, a.assignedClass, gvcnNameOfClass(a.assignedClass), loaiLabelOf(a.loai), a.username, a.password]); });
  var csv = '\uFEFF' + rows.map(function(r){ return r.map(q).join(','); }).join('\r\n');
  downloadBlob('DanhSach_TaiKhoan_'+(loai==='saodo'?'SaoDo':'GVCN')+'_XuanTan.csv', new Blob([csv], { type:'text/csv;charset=utf-8' }));
  notify('Đã tải danh sách '+list.length+' tài khoản '+loaiLabelOf(loai)+'. Hãy cất file ở nơi riêng tư vì có chứa mật khẩu.');
}

      + '<button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="bulkCreateAccounts(\''+loai+'\')">'+icon('userPlus',15)+' Tạo '+n+' tài khoản '+loaiLabelOf(loai)+'</button>'
      + '<div class="row" style="margin-top:8px;gap:8px;">'
        + '<button class="btn btn-outline" style="flex:1;justify-content:center;" onclick="exportAccountsCsv(\''+loai+'\')">'+icon('download',14)+' Tải danh sách</button>'
        + '<button class="btn btn-outline" style="flex:1;justify-content:center;" onclick="printAccountsList(\''+loai+'\')">'+icon('printer',14)+' In</button>'
      + '</div>'
      + (loai==='saodo'? '<button class="btn btn-outline" style="width:100%;justify-content:center;margin-top:8px;color:#dc2626;border-color:#fecaca;" onclick="deleteAllSaoDoAccounts()">'+icon('trash',14)+' Xóa hết tài khoản Sao Đỏ để tạo mới</button>' : '')
    + '</div>';
  }
  return '<div class="card stack">'
    + '<strong style="display:flex;align-items:center;gap:7px;">'+icon('userCog',16)+' Tạo tài khoản hàng loạt</strong>'
    + '<p style="font-size:11.5px;color:var(--slate-500);">Mỗi nút tạo một lần tài khoản cho tất cả Chi đội chưa có (mỗi Chi đội 1 tài khoản). Tên đăng nhập theo mẫu <strong>saodo.6.1</strong> / <strong>gvcn.6.1</strong>, mật khẩu ngẫu nhiên 8 ký tự. Chi đội đã có tài khoản được giữ nguyên.</p>'
    + line('saodo')
    + line('gvcn')
  + '</div>';
}
function BulkResultModalHTML(){
  var r = ui.accounts.bulkResult;
  var rows = r.created.map(function(a){
    return '<tr><td><span class="badge" style="'+badgeStyle('blue')+'">'+esc(a.assignedClass)+'</span></td><td style="font-weight:600;">'+esc(a.username)+'</td><td style="font-family:Consolas,monospace;font-size:12px;">'+esc(a.password)+'</td></tr>';
  }).join('');
  return '<div class="modal-overlay" onclick="if(event.target===this) closeBulkResult();">'
    + '<div class="modal">'
      + '<div class="modal-head"><strong>'+icon('checkCircle2',17)+' Đã tạo '+r.created.length+' tài khoản '+esc(r.label)+'</strong><button class="icon-btn" onclick="closeBulkResult()">'+icon('x',18)+'</button></div>'
      + '<div class="modal-body stack">'
        + '<p style="font-size:12.5px;color:var(--slate-600);">'+(r.existed? r.existed+' Chi đội đã có tài khoản từ trước (giữ nguyên). ' : '')+'Hãy <strong>tải hoặc in danh sách ngay</strong> để phát cho giáo viên. Mật khẩu vẫn xem lại được trong bảng “Danh sách tài khoản”, và có thể đổi bằng biểu tượng chìa khóa.</p>'
        + '<div class="tbl-wrap" style="max-height:300px;overflow:auto;"><table><thead><tr><th>Chi đội</th><th>Tên đăng nhập</th><th>Mật khẩu</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
        + '<div class="row" style="gap:8px;flex-wrap:wrap;">'
          + '<button class="btn btn-primary" style="flex:1;justify-content:center;" onclick="exportAccountsCsv(\''+r.loai+'\')">'+icon('download',15)+' Tải danh sách (.csv)</button>'
          + '<button class="btn btn-outline" style="flex:1;justify-content:center;" onclick="printAccountsList(\''+r.loai+'\')">'+icon('printer',15)+' In danh sách</button>'
        + '</div>'
      + '</div>'
    + '</div>'
  + '</div>';
}

/* V13 — Xóa hết tài khoản Sao Đỏ để tạo mới (dùng khi chuyển sang tuần thi đua khác) */
function deleteAllSaoDoAccounts(){
  if(!requireAdmin('Xóa tài khoản Sao Đỏ')) return;
  var list = accountsOfLoai('saodo');
  if(!list.length){ alert('Hiện chưa có tài khoản Sao Đỏ nào để xóa.'); return; }
  if(!confirm('XÓA HẾT '+list.length+' tài khoản Sao Đỏ?\n\n• Chỉ xóa tài khoản đăng nhập của Sao Đỏ; điểm thi đua đã chấm, danh sách Đội viên và tài khoản GVCN được giữ nguyên.\n• Mật khẩu cũ sẽ không còn dùng được.\n• Sau đó bấm “Tạo '+classCodes().length+' tài khoản Sao Đỏ” để cấp tài khoản mới cho tuần khác.\n\nNếu cần lưu danh sách tài khoản hiện tại, hãy bấm Hủy và “Tải danh sách” trước.\n\nTiếp tục xóa?')) return;
  state.accounts = state.accounts.filter(function(a){ return a.loai!=='saodo'; });
  list.forEach(function(a){ delete ui.accounts.visiblePw[a.id]; });
  ui.accounts.bulkResult = null;
  persist();
  notify('Đã xóa '+list.length+' tài khoản Sao Đỏ. Bấm “Tạo '+classCodes().length+' tài khoản Sao Đỏ” để tạo mới.');
  render();
}

</script>
